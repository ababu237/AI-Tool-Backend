# Pytest configuration file for SI AI Tool Backend tests

[tool:pytest]
# Test discovery
testpaths = unit_tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --disable-warnings
    --tb=short
    --cov=backend_api
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    security: Security related tests
    performance: Performance tests
    api: API endpoint tests
    utility: Utility function tests
    error: Error handling tests
    edge_case: Edge case tests
    mock: Tests using mocks
    file_upload: File upload tests
    translation: Translation tests
    audio: Audio processing tests
    concurrent: Concurrent execution tests

# Test timeout
timeout = 300

# Minimum Python version
minversion = 6.0

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:torch.*
    ignore::UserWarning:torchvision.*

# Test discovery patterns
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    __pycache__

# Async testing
asyncio_mode = auto

# Coverage configuration
[coverage:run]
source = backend_api
omit = 
    backend_api/__pycache__/*
    backend_api/config/*
    */tests/*
    */venv/*
    */env/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:

[coverage:html]
directory = htmlcov
title = SI AI Tool Backend Test Coverage